name: CyberDyne CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# FIX: Explicitly define workflow-level permissions for security (Principle of Least Privilege)
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: self-hosted

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Build Docker Image
      run: docker build -t data-processing-api:latest .