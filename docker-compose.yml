version: '3.8'

services:
  api:
    build: .
    image: data-processing-api:latest
    container_name: cyberdyne-api
    # FIX: Bind port strictly to localhost (127.0.0.1) instead of 0.0.0.0 
    # to prevent unauthorized external access from public networks.
    ports:
      - "127.0.0.1:5000:5000"
    
    # FIX: Added a restart policy for reliability and container resilience
    restart: unless-stopped
    
    environment:
      - FLASK_ENV=production
      
    # FIX: Security hardening option to prevent privilege escalation inside the container
    security_opt:
      - no-new-privileges:true